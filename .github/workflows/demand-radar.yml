name: demand-radar

on:
  push:
    paths: ["demand-radar/**", ".github/workflows/demand-radar.yml"]
  pull_request:
    paths: ["demand-radar/**", ".github/workflows/demand-radar.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demand-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demand-radar/requirements.lock
      # 依赖按锁文件的精确版本装，测试工具按 pyproject 的 dev 可选依赖装
      - run: pip install -r requirements.lock -e ".[dev]"
      # 单元测试离线运行，不需要网络、MongoDB 或模型。
      # 评测（eval）需要本地模型，不在 CI 里跑，发版前手动执行
      - run: python -m unittest discover -s tests -v
      - name: 检查 Docker 镜像能构建
        run: docker build -t demand-radar .
