# 数据源配置。加源只改这个文件；Docker 部署时挂载进容器，改完无需重建镜像。
# 每个源的抓取条数由 --limit 控制（RSS 按每个订阅、HN/GitHub 按每个查询计）。

# StackExchange 软件推荐站：几乎每条都是「有没有能做 X 的软件」
# 不带 key 每天 300 次请求；设置环境变量 SE_API_KEY 可提高到每天 1 万次
[softwarerecs]
enabled = true
sites = ["softwarerecs"]

# Hacker News 全文搜索（帖子 + 评论），按短语精确匹配
[hn_algolia]
enabled = true
queries = [
  "I wish there was",
  "is there a tool",
  "is there an app",
  "someone should build",
  "would pay for",
]

# GitHub issues：点赞多的 feature request = 很多人想要、项目一直没做
# 不带 token 每分钟 10 次搜索；设置 GITHUB_TOKEN 可提高到每分钟 30 次
[github]
enabled = true
queries = [
  "is:issue is:open label:enhancement reactions:>50",
  'is:issue is:open "feature request" in:title reactions:>20',
]

# Reddit（走 Arctic Shift 第三方归档 API，无需 key）：按版块拉最新帖子，关键词在本地筛。
# 比 RSS 好在不限流、能回填历史、老帖带 score；但它是志愿者维护的免费服务、不保证可用，
# 所以下面四个 Reddit RSS 订阅保留做兜底——同一帖子两边都抓到会按 id 去重，不会重复抽取。
# 调研与条款见 docs/arctic-shift.md
[arctic_shift]
enabled = true
subreddits = ["SomebodyMakeThis", "macapps", "androidapps", "software"]

# 本地关键词过滤：标题或正文含任一短语才保留（不区分大小写）；没列出的版块全部保留。
# 只作用于日常抓取，回填拉整个版块（原因见 demand_radar/sources/arctic_shift.py）
[arctic_shift.keywords]
macapps = ["is there a", "looking for", "any app", "recommend"]
androidapps = ["is there a", "looking for", "any app", "recommend"]
software = ["is there a", "looking for", "recommend", "alternative to"]

# RSS / Atom 订阅，加一个 [[rss]] 块就是加一个源
# 下面四个 Reddit 订阅和 [arctic_shift] 覆盖同样的版块，是它的兜底；嫌 429 日志吵可以删掉
[[rss]]
name = "reddit/SomebodyMakeThis"
url = "https://www.reddit.com/r/SomebodyMakeThis/new/.rss"

[[rss]]
name = "reddit/macapps"
url = "https://www.reddit.com/r/macapps/search.rss?q=%22is+there+an+app%22&restrict_sr=1&sort=new"

[[rss]]
name = "reddit/androidapps"
url = "https://www.reddit.com/r/androidapps/search.rss?q=%22is+there+an+app%22&restrict_sr=1&sort=new"

[[rss]]
name = "reddit/software"
url = "https://www.reddit.com/r/software/search.rss?q=%22looking+for%22&restrict_sr=1&sort=new"

# 抓取限速：同一个域名的两次请求之间至少隔多少秒，对所有源生效（实现见 demand_radar/sources/http.py）。
# 被限流（429）后会按服务器的 Retry-After 让整个域名冷却，不只是重试那一次。
# 已内置的默认值：GitHub 6.5 秒（设了 GITHUB_TOKEN 是 2.5）、Reddit 3 秒、其他已知站点 1 秒。
[http]
min_interval = 1.0   # 没单独配置的域名用这个

[http.hosts]
# 按域名覆盖，比如自己的博客或内网服务想更客气一点：
# "blog.example.com" = 10.0

# 规则预过滤：明显不是需求的内容不交给模型。规则说明见 demand_radar/filters.py
[filters]
# 想关闭某条规则，把名字写进来，例如 ["empty_body"]
disabled = []
# 这些来源发布的是产品而不是需求，整源跳过（例如以后接入 Product Hunt 的 RSS）
supply_sources = ["producthunt"]

# 综合排序的权重：排序分 = 各项打分(1–5)×权重 + log(1+热度)×heat 权重。说明见 demand_radar/rank.py
[ranking]
clarity = 1.0      # 需求描述得清不清楚
intensity = 1.5    # 用户有多想要
feasibility = 1.0  # 个人做起来容不容易
heat = 1.0         # 原帖热度
