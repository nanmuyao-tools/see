# 数据源配置。加源只改这个文件；Docker 部署时挂载进容器，改完无需重建镜像。
# 每个源的抓取条数由 --limit 控制（RSS 按每个订阅、HN/GitHub 按每个查询计）。

# StackExchange 软件推荐站：几乎每条都是「有没有能做 X 的软件」
# 不带 key 每天 300 次请求；设置环境变量 SE_API_KEY 可提高到每天 1 万次
[softwarerecs]
enabled = true
sites = ["softwarerecs"]

# Hacker News 全文搜索（帖子 + 评论），按短语精确匹配
[hn_algolia]
enabled = true
queries = [
  "I wish there was",
  "is there a tool",
  "is there an app",
  "someone should build",
  "would pay for",
  "wish someone would",      # 调研 2026-10-28 抽样约 5/30 是需求
  "does anyone know of",
]

# Ask HN 帖子：每周约 240 帖、浓度低，先在本地按整词关键词筛一遍再交给模型。
# 删掉这个表（或整段注释）就关闭。--limit 不管它，一次最多取 100 帖
[hn_algolia.ask_hn]
keywords = ["is there", "looking for", "recommend", "should there be", "alternative", "alternatives",
            "wish", "any way to", "a tool", "an app", "tool for", "app for", "software for"]

# GitHub issues：点赞多的 feature request = 很多人想要、项目一直没做
# 不带 token 每分钟 10 次搜索；设置 GITHUB_TOKEN 可提高到每分钟 30 次
[github]
enabled = true
queries = [
  "is:issue is:open label:enhancement reactions:>50",
  'is:issue is:open "feature request" in:title reactions:>20',
]

# Bluesky 帖子搜索（官方公开接口，无需 key）：量小但浓度高——调研（2026-10-28）里
# "is there an app" 约每周 14 条、抽样约 8/29 是需求。只有 api.bsky.app 未登录可用，且只能取第一页
[bluesky]
enabled = true
queries = [
  "is there an app",
  "is there a tool",
  "i wish there was an app",
]

# Reddit（走 Arctic Shift 第三方归档 API，无需 key）：按版块拉最新帖子，关键词在本地筛。
# 比 RSS 好在不限流、能回填历史、老帖带 score；但它是志愿者维护的免费服务、不保证可用，
# 所以下面四个 Reddit RSS 订阅保留做兜底——同一帖子两边都抓到会按 id 去重，不会重复抽取。
# 调研与条款见 docs/arctic-shift.md
[arctic_shift]
enabled = true
subreddits = ["SomebodyMakeThis", "macapps", "androidapps", "software"]

# 本地关键词过滤：标题或正文含任一短语才保留（不区分大小写）；没列出的版块全部保留。
# 只作用于日常抓取，回填拉整个版块（原因见 demand_radar/sources/arctic_shift.py）
[arctic_shift.keywords]
macapps = ["is there a", "looking for", "any app", "recommend"]
androidapps = ["is there a", "looking for", "any app", "recommend"]
software = ["is there a", "looking for", "recommend", "alternative to"]

# RSS / Atom 订阅，加一个 [[rss]] 块就是加一个源
# 下面四个 Reddit 订阅和 [arctic_shift] 覆盖同样的版块，是它的兜底；嫌 429 日志吵可以删掉
[[rss]]
name = "reddit/SomebodyMakeThis"
url = "https://www.reddit.com/r/SomebodyMakeThis/new/.rss"

[[rss]]
name = "reddit/macapps"
url = "https://www.reddit.com/r/macapps/search.rss?q=%22is+there+an+app%22&restrict_sr=1&sort=new"

[[rss]]
name = "reddit/androidapps"
url = "https://www.reddit.com/r/androidapps/search.rss?q=%22is+there+an+app%22&restrict_sr=1&sort=new"

[[rss]]
name = "reddit/software"
url = "https://www.reddit.com/r/software/search.rss?q=%22looking+for%22&restrict_sr=1&sort=new"

# V2EX「问与答」节点（中文，公开 Atom feed）：每周约 240 帖，调研抽样约 5/30 是需求。
# 每天读一次、同域名限速；条款页当时没能打开（403），接入前读过 robots 和 feed 的公开性。
# limit 单独设成 50：全局的 --limit 10 会漏掉大半
[[rss]]
name = "v2ex/qna"
url = "https://www.v2ex.com/feed/qna.xml"
limit = 50

# 应用商店低分评论：从别人 app 的 1–3 星评论里找「换个 app 就能解决」的痛点。
# 默认关闭：两个商店都不是公开 API，苹果和 Google 的条款、robots.txt 都不鼓励自动抓取，
# 开启前请先读 docs/research/2026-10-20-app-store-reviews.md 第五节，自己判断。
# 评论用单独的提示词抽取（见 demand_radar/extract.py 的 _REVIEW_SYSTEM），评测：
#   demand-radar eval --eval-set eval/review_set.json
# 限速：两个商店都是同域名至少隔 5 秒；每个 app 每轮最多翻 max_pages 页，
# 翻到上次看过的评论就停；凑够 --limit 条低分评论也不再往后翻（已取回的这一页都保留，
# App Store 一页 50 条、Google Play 一页 100 条，所以首轮实际条数会多于 --limit）。
# name 会成为来源名的一部分（如 appstore/cn/鲨鱼记账），定了就别改。

# App Store：苹果的评论 RSS。一页 50 条，最多 10 页。
# app id 在 App Store 网页地址里：apps.apple.com/cn/app/xxx/id1079718756 → 1079718756
[appstore]
enabled = false
max_rating = 3      # 只要 1–3 星
max_pages = 2       # 每个 app 每个国家每轮最多几页（上限 10）

[[appstore.apps]]
name = "鲨鱼记账"
id = 1079718756
countries = ["cn"]

[[appstore.apps]]
name = "随手记"
id = 372353614
countries = ["cn"]

[[appstore.apps]]
name = "Notion"
id = 1232780281
countries = ["us"]

[[appstore.apps]]
name = "YNAB"
id = 1010865877
countries = ["us"]

# Google Play：Play 网页用的内部接口。一页 100 条，按最新排序。
# 包名在 Play 网页地址里：play.google.com/store/apps/details?id=notion.id → notion.id
# locales 写「语言-地区」，如 en-US、zh-TW。Google Play 在大陆没有服务，没有简体中文区。
[googleplay]
enabled = false
max_rating = 3
max_pages = 2       # 每个 app 每个地区每轮最多几页（上限 5）

[[googleplay.apps]]
name = "Notion"
package = "notion.id"
locales = ["en-US", "zh-TW"]

[[googleplay.apps]]
name = "YNAB"
package = "com.youneedabudget.evergreen.app"
locales = ["en-US"]

# 抓取限速：同一个域名的两次请求之间至少隔多少秒，对所有源生效（实现见 demand_radar/sources/http.py）。
# 被限流（429）后会按服务器的 Retry-After 让整个域名冷却，不只是重试那一次。
# 已内置的默认值：GitHub 6.5 秒（设了 GITHUB_TOKEN 是 2.5）、Reddit 3 秒、其他已知站点 1 秒。
[http]
min_interval = 1.0   # 没单独配置的域名用这个

[http.hosts]
# 按域名覆盖，比如自己的博客或内网服务想更客气一点：
# "blog.example.com" = 10.0

# 规则预过滤：明显不是需求的内容不交给模型。规则说明见 demand_radar/filters.py
[filters]
# 想关闭某条规则，把名字写进来，例如 ["empty_body"]
disabled = []
# 这些来源发布的是产品而不是需求，整源跳过（例如以后接入 Product Hunt 的 RSS）
supply_sources = ["producthunt"]

# 综合排序的权重：排序分 = 各项打分(1–5)×权重 + log(1+热度)×heat 权重。说明见 demand_radar/rank.py
# 分两个榜：GitHub 的功能请求单独一榜，其余来源是愿望榜，清单 / 周报 / 看板分开展示、各排各的
[ranking]
clarity = 1.0      # 需求描述得清不清楚
intensity = 1.5    # 用户有多想要
feasibility = 1.0  # 个人做起来容不容易
heat = 1.0         # 原帖热度：功能请求榜（GitHub）用，热度本来就是它的主要信号
heat_wish = 0.3    # 原帖热度：愿望榜（其余来源）用；这些源基本没有热度信号，只作微调
