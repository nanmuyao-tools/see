# 需求雷达：一条命令本地部署
#   docker compose up
# 结果输出到 ./out/demands.md
#
# 说明：app 跑完一轮即退出（批处理任务）；mongo 与 ollama 常驻。
# 想再跑一次：docker compose run --rm app  （可追加 --limit 50 等参数）
# 想定时跑：docker compose --profile cron up -d scheduler  （见文件末尾的 scheduler 服务）

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # 默认仅容器内网互通，不对外暴露端口；需要本机连调试时再放开下面两行
    # ports:
    #   - "27017:27017"

  ollama:
    image: ollama/ollama:0.40.6     # 固定版本，部署可复现；升级时改这里并重跑 eval
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama   # 模型缓存，避免每次重拉
    # 用 Clash/mihomo fake-ip 模式时模型下载会失败（redirect target not allowed … non-public 198.18.x.x）。
    # 解法见 README「常见问题」；若选第二种，打开下面两行并填入查到的真实 IP：
    # extra_hosts:
    #   - "dd20bb891979d25aebc8bec07b2b3bbc.r2.cloudflarestorage.com:172.64.66.1"
    # 想用本机已装的 ollama 时可注释掉本服务，并把 app 的 OLLAMA_API 指向宿主机

  app:
    build: .
    # app / scheduler / web 共用这一个镜像：构建一次三个都更新（以前各自构建，只 build app 不会更新另两个）
    image: demand-radar:local
    # 容器以 uid 1000 运行。Linux 上 ./out 属于别的用户时，入口脚本会提示；也可以直接改成自己的 uid:gid
    # user: "1000:1000"
    depends_on:
      - mongo
      - ollama
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      OLLAMA_API: "http://ollama:11434"            # 入口脚本拉模型用
      OLLAMA_BASE_URL: "http://ollama:11434/v1"    # Instructor 调用用
      # 抽取模型。换模型改 .env 里的 DR_MODEL；按本机配置推荐：docker compose run --rm app recommend
      # 默认 Apache-2.0，约 2.5GB，8GB 内存可跑；61 条评测中文 F1 95.2% / 英文 96.8%，容器 CPU 每条约 7 秒
      OLLAMA_MODEL: "${DR_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      DR_PROVIDER: "ollama/${DR_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"
      DR_OUTPUT_LANGUAGE: "${DR_OUTPUT_LANGUAGE:-zh}"  # 输出语言：zh 中文 / en 英文
      DR_LIMIT: "${DR_LIMIT:-10}"                    # 每个源/查询最多抓多少条；临时改：DR_LIMIT=3 docker compose up
      DR_MIN_CONFIDENCE: "0.5"
      DR_WORKERS: "2"                                # 同时发给模型的请求数；ollama 默认串行，需配 OLLAMA_NUM_PARALLEL 才并行
      DR_OUTPUT: "out/demands.md"
      # 相似需求合并（cluster 命令 / run --cluster）：嵌入模型由入口脚本代拉；DR_CLUSTER=1 让 run 和 scheduler 顺手合并
      DR_CLUSTER: "${DR_CLUSTER:-0}"
      DR_EMBED_MODEL: "${DR_EMBED_MODEL:-qwen3-embedding:0.6b}"   # 要懂中文；选型见 demand_radar/cluster.py
      DR_EMBED_BASE_URL: "${DR_EMBED_BASE_URL:-}"   # 空 = 用上面的 ollama；Mac GPU 路线指向 Mac 上原生的 Ollama
      DR_CLUSTER_THRESHOLD: "${DR_CLUSTER_THRESHOLD:-0.78}"
      # 可选：提高限额。不设也能用
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"            # GitHub 搜索：10 → 30 次/分钟
      SE_API_KEY: "${SE_API_KEY:-}"                # StackExchange：300 → 1 万次/天
    volumes:
      - ./out:/app/out          # 需求清单输出到宿主机 ./out
      - ./sources.toml:/app/sources.toml:ro   # 改数据源无需重建镜像

  # 可选的定时服务：常驻，启动先跑一次，之后每天 DR_RUN_AT 跑 run，每周 DR_DIGEST_WEEKDAY 那天再出周报。
  # 默认不启动（profile 为 cron）：docker compose --profile cron up -d scheduler
  # 配置、挂载都继承 app，只改启动命令；时刻按容器时钟（UTC）算
  scheduler:
    extends:
      service: app
    profiles: ["cron"]
    restart: unless-stopped
    depends_on:
      - mongo
      - ollama
    command: ["schedule"]
    environment:
      DR_RUN_AT: "${DR_RUN_AT:-03:00}"              # 每天几点（UTC）
      DR_DIGEST_WEEKDAY: "${DR_DIGEST_WEEKDAY:-1}"  # ISO 周几出周报：1 周一 … 7 周日，0 不出
      DR_RUN_ON_START: "${DR_RUN_ON_START:-1}"      # 启动时先跑一次

  # 可选的 Web 看板：常驻，直接读 MongoDB、不需要模型，浏览器打开 http://localhost:8501
  # 默认不启动（profile 为 web）：docker compose --profile web up -d web
  # 配置、挂载继承 app，只改启动命令；只依赖 mongo（入口脚本看到 serve 也不会去等 ollama）
  web:
    extends:
      service: app
    profiles: ["web"]
    restart: unless-stopped
    depends_on: !override
      - mongo
    command: ["serve"]
    ports:
      # 只绑本机回环地址：看板没有登录，不该对局域网开放。宿主机端口被占时：DR_WEB_PORT=8600
      - "127.0.0.1:${DR_WEB_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo-data:
  ollama-models:
